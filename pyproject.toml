[project]
name = "pdb-structure-finder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "typer>=0.27.2",
]

[project.scripts]
pdb-structure-finder = "pdb_structure_finder:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
